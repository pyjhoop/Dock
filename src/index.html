<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="layout-side">
    <aside id="rail">
      <div id="accounts"></div>
      <button class="rail-btn" id="btn-add" title="서비스 추가"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="spacer"></div>
      <button class="rail-btn" id="btn-downloads" title="다운로드"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span class="dot" id="dl-dot" hidden></span></button>
      <button class="rail-btn" id="btn-lock" title="잠금 (Ctrl+L)"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>
      <button class="rail-btn" id="btn-settings" title="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
    </aside>
    <section id="main">
      <header id="bar">
        <div id="tabs"></div>
        <div class="bar-actions">
          <button class="icon" id="nav-back" title="뒤로"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button class="icon" id="nav-forward" title="앞으로"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="icon" id="nav-reload" title="새로고침 (Ctrl+R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.7M20 4v5h-5"/></svg></button>
          <button class="icon" id="nav-home" title="처음 화면"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg></button>
          <button class="primary" id="btn-compose"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>새 메일</button>
        </div>
      </header>
      <div id="offline" hidden>오프라인 상태예요. 연결되면 자동으로 다시 불러올게요.</div>
      <div id="loginbar" hidden>
        <span id="login-text"></span>
        <button class="primary" id="btn-login-done">로그인 완료</button>
      </div>
      <div id="content"><div id="empty">서비스를 추가해 시작하세요</div></div>
    </section>
  </div>
  <div id="modal" hidden></div>
  <div id="lock" hidden>
    <form id="lock-form">
      <div class="lock-icon"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></div>
      <h2>Dock이 잠겨 있어요</h2>
      <input id="lock-input" type="password" placeholder="패스코드" autocomplete="off" />
      <div id="lock-msg"></div>
      <button class="primary" type="submit">잠금 해제</button>
    </form>
  </div>
  <div id="toast" hidden></div>
  <script src="service-icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
