name: release

# v로 시작하는 태그를 푸시하면 빌드 후 GitHub Release(초안 아님)로 게시한다.
#   git tag v0.1.0 && git push origin v0.1.0
# 수동 실행(workflow_dispatch)은 빌드 결과를 Actions 아티팩트로만 남기고 릴리즈는 만들지 않는다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: npm install

      - name: 태그에서 버전 반영
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $f = 'src-tauri/tauri.conf.json'
          $j = Get-Content $f -Raw | ConvertFrom-Json
          $j.version = $v
          $j | ConvertTo-Json -Depth 20 | Set-Content $f -Encoding utf8
          Write-Host "version = $v"

      - name: Build & publish (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'Dock ${{ github.ref_name }}'
          releaseBody: '설치 파일(`Dock_*_x64-setup.exe`)을 받아 실행하세요.'
          releaseDraft: false
          prerelease: false
          args: --features custom-protocol

      - name: Build only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build -- --features custom-protocol

      - name: Upload installer artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: dock-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
